<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ascend</title>
<style>
  :root {
    --bg: #0d1b2e;
    --surface: #152a45;
    --line: #25405f;
    --text: #e9eff7;
    --muted: #8fa5bf;
    --accent: #6ea2ff;
    --accent-ink: #08162b;
    --user: #1f3d66;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 1.25rem; margin: 0; letter-spacing: .02em; font-weight: 700; }
  header span { color: var(--muted); font-size: .85rem; margin-left: 10px; font-weight: 400; }
  #clear {
    background: none; border: 1px solid var(--line); color: var(--muted);
    padding: 6px 12px; border-radius: 8px; font-size: .85rem; cursor: pointer;
  }
  #log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: min(680px, 88%); padding: 11px 14px; border-radius: 14px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
  .user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: var(--surface); border-bottom-left-radius: 4px; }
  .bot.error { color: #ffb4b4; }
  #empty { margin: auto; text-align: center; color: var(--muted); max-width: 320px; line-height: 1.5; }
  #empty strong { color: var(--text); display: block; font-size: 1.1rem; margin-bottom: 6px; }
  form { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line); }
  textarea {
    flex: 1; resize: none; background: var(--surface); color: var(--text);
    border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px;
    font: inherit; max-height: 140px;
  }
  textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #send {
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px;
    padding: 0 18px; font: inherit; font-weight: 700; cursor: pointer;
  }
  #send:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>Ascend<span>tu asistente</span></h1>
  <button id="clear" type="button">Nueva conversación</button>
</header>
<main id="log" aria-live="polite"></main>
<form id="form">
  <textarea id="input" rows="1" placeholder="Escribe un mensaje" aria-label="Mensaje"></textarea>
  <button id="send" type="submit">Enviar</button>
</form>

<script>
  const WORKER_URL = "https://ascend.matiasoveido18.workers.dev";

  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const KEY = "ascend_history";
  let history = [];

  try { history = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { history = []; }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(history.slice(-40))); } catch (e) {}
  }

  function add(role, text, extra) {
    const empty = document.getElementById("empty");
    if (empty) empty.remove();
    const d = document.createElement("div");
    d.className = "msg " + (role === "user" ? "user" : "bot") + (extra ? " " + extra : "");
    d.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }

  function render() {
    log.innerHTML = "";
    if (!history.length) {
      log.innerHTML = '<div id="empty"><strong>Hola, soy Ascend</strong>Puedo ayudarte con dudas, diagnóstico técnico, negocios y estudio. ¿Por dónde empezamos?</div>';
      return;
    }
    history.forEach(m => add(m.role, m.content));
  }

  document.getElementById("clear").onclick = () => { history = []; save(); render(); };

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = ""; input.style.height = "auto";
    history.push({ role: "user", content: text });
    add("user", text);
    send.disabled = true;
    const pending = add("bot", "Pensando...");
    try {
      const r = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history.slice(-30) })
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || "Error del servidor");
      pending.textContent = data.reply;
      history.push({ role: "assistant", content: data.reply });
      save();
    } catch (err) {
      history.pop();
      pending.textContent = "No pude responder: " + err.message;
      pending.classList.add("error");
    }
    send.disabled = false;
    log.scrollTop = log.scrollHeight;
  });

  render();
</script>
</body>
</html>
